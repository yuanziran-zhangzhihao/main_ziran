name: pwn_router

on:
  push:
    branches: [pwn-router]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "routerd.c"
      - "Makefile"
      - "run.sh"
      - "solve.py"
      - "README.md"
      - ".github/workflows/pwn_router.yml"
  workflow_dispatch:

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/pwn-router
  IMAGE_SHA_TAG: sha-${{ github.sha }}

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check challenge files
        run: |
          test -f Dockerfile
          test -f docker-compose.yml
          test -f routerd.c
          test -f Makefile
          test -f solve.py

      - name: Build static binary
        run: |
          make clean
          make STATIC=1
          file routerd

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_SHA_TAG }}

      - name: Pull image for smoke test and artifact extraction
        run: docker pull ${{ env.IMAGE_REPO }}:${{ env.IMAGE_SHA_TAG }}

      - name: Smoke test published image
        run: |
          docker run -d --name pwn-router-smoke \
            -p 18080:8080 \
            -e 'FLAG_VALUE=flag{smoke_test_router}' \
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_SHA_TAG }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/ >/dev/null
          python3 solve.py --host 127.0.0.1 --port 18080 --expect 'flag{smoke_test_router}'

      - name: Dump smoke logs on failure
        if: failure()
        run: docker logs pwn-router-smoke || true

      - name: Remove smoke container
        if: always()
        run: docker rm -f pwn-router-smoke || true

      - name: Export challenge bundle
        run: |
          mkdir -p dist
          cp routerd dist/routerd
          cp routerd.c dist/routerd.c
          cp README.md dist/README.md
          cp solve.py dist/solve.py
          cp run.sh dist/run.sh
          cp Dockerfile dist/Dockerfile
          cp docker-compose.yml dist/docker-compose.yml
          tar -czf dist/pwn-router-bundle.tar.gz \
            -C dist \
            routerd routerd.c README.md solve.py run.sh Dockerfile docker-compose.yml

      - name: Verify exported files
        run: |
          test -f dist/routerd
          test -f dist/routerd.c
          test -f dist/README.md
          test -f dist/solve.py
          test -f dist/pwn-router-bundle.tar.gz
          file dist/routerd
          ls -lh dist

      - name: Export image tar for platform import
        run: |
          cid="$(docker create "${{ env.IMAGE_REPO }}:${{ env.IMAGE_SHA_TAG }}")"
          trap 'docker rm -v "$cid" >/dev/null 2>&1 || true' EXIT
          docker export "$cid" -o dist/rootfs.tar
          docker import \
            --change 'EXPOSE 8080' \
            --change 'WORKDIR /app' \
            --change 'CMD /app/routerd' \
            dist/rootfs.tar \
            "pwn-router:platform-${{ github.sha }}"
          rm -f dist/rootfs.tar
          docker save "pwn-router:platform-${{ github.sha }}" | gzip -9 > dist/pwn-router-image.tar.gz
          ls -lh dist/pwn-router-image.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pwn-router-artifacts
          path: dist/

  prune-old-images:
    runs-on: ubuntu-latest
    needs: challenge-build
    if: always()
    permissions:
      packages: write

    steps:
      - name: Clean old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: pwn-router
          exclude-tags: latest
          dry-run: true
          delete-untagged: true
          delete-ghost-images: true
