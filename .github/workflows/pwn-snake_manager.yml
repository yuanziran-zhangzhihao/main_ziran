name: pwn-snake_manager

on:
  push:
    branches: [pwn-snake_manager]
    paths:
      - "pwn-snake_manager/**"
      - ".github/workflows/pwn-snake_manager.yml"
  workflow_dispatch:

env:
  NAME: pwn-snake_manager
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check required files
        run: |
          test -f pwn-snake_manager/build/Dockerfile
          test -f pwn-snake_manager/build/post-build.sh
          test -f pwn-snake_manager/build/src/snake_server.c
          test -f pwn-snake_manager/build/src/challenge-entry.sh
          test -f pwn-snake_manager/build/src/start.sh
          test -f pwn-snake_manager/build/smoke.py

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./pwn-snake_manager/build
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:sha-${{ github.sha }}

      - name: Run post-build script
        working-directory: pwn-snake_manager/build
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          NAME: ${{ env.NAME }}
          IMAGE_TAG: ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:sha-${{ github.sha }}
        run: |
          chmod +x post-build.sh
          ./post-build.sh

      - name: Start smoke container
        run: |
          docker run -d --name pwn-snake-manager-smoke \
            -p 8000:8000 \
            -e 'FLAG=FLAG{ci_smoke_test}' \
            ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:sha-${{ github.sha }}

      - name: Wait for listener log
        run: |
          ready=0
          for _ in $(seq 1 30); do
            if docker logs pwn-snake-manager-smoke 2>&1 | grep -q 'pwn-snake_manager service listening on 8000'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run interaction smoke test
        run: |
          python3 pwn-snake_manager/build/smoke.py \
            --host 127.0.0.1 \
            --port 8000 \
            --ready-timeout 60

      - name: Capture smoke diagnostics
        if: failure()
        run: |
          docker ps -a > docker-ps.log 2>&1 || true
          docker logs pwn-snake-manager-smoke > pwn-snake-manager-smoke.log 2>&1 || true
          docker top pwn-snake-manager-smoke -eo pid,ppid,cmd > pwn-snake-manager-smoke.top 2>&1 || true

      - name: Verify attachments
        run: |
          test -f pwn-snake_manager/attachments/pwn
          test -f pwn-snake_manager/attachments/libc.so.6
          test -f pwn-snake_manager/attachments/ld-linux-x86-64.so.2
          test -f pwn-snake_manager/attachments/libncurses.so.6
          test -f pwn-snake_manager/attachments/libtinfo.so.6
          test -f pwn-snake_manager/attachments/libdl.so.2
          ls -lh pwn-snake_manager/attachments

      - name: Upload attachments
        uses: actions/upload-artifact@v4
        with:
          name: pwn-snake_manager-attachments
          path: pwn-snake_manager/attachments/

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pwn-snake_manager-smoke-logs
          path: |
            docker-ps.log
            pwn-snake-manager-smoke.log
            pwn-snake-manager-smoke.top

      - name: Cleanup smoke container
        if: always()
        run: |
          docker rm -f pwn-snake-manager-smoke >/dev/null 2>&1 || true

  prune-old-images:
    runs-on: ubuntu-latest
    needs: challenge-build
    if: always()
    permissions:
      packages: write

    steps:
      - name: Clean old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: pwn-snake_manager
          exclude-tags: latest
          dry-run: true
          delete-untagged: true
          delete-ghost-images: true
