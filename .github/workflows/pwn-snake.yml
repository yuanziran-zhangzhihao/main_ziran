name: pwn-snake

on:
  push:
    branches: [pwn-snake]
    paths:
      - "pwn-snake/**"
      - ".github/workflows/pwn-snake.yml"
  workflow_dispatch:

env:
  NAME: pwn-snake  # 项目名称（和目录名一致）
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}  # 镜像前缀，例如 ghcr.io/yuanziran-zhangzhihao

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 推送容器镜像到 GHCR 所需
      id-token: write

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true

      # 2. 检查 Dockerfile 是否存在
      - name: Check Dockerfile
        run: |
          dockerfile_path="${{ env.NAME }}/build/Dockerfile"
          echo "Looking for Dockerfile at: $dockerfile_path"
          if [ ! -f "$dockerfile_path" ]; then
            echo "❌ Dockerfile not found!"
            exit 1
          fi
          echo "✅ Dockerfile found at: $(pwd)/$dockerfile_path"

      # 3. 登录 GHCR
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 构建并推送镜像
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.NAME }}/build
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:latest

      # 5. 运行 post-build 脚本（提取附件等）
      - name: Run post-build script
        working-directory: ${{ env.NAME }}/build
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          NAME: ${{ env.NAME }}
          IMAGE_TAG: ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:latest
        run: |
          chmod +x post-build.sh
          ./post-build.sh

      # 6. 上传附件到 Artifacts
      - name: Upload attachments
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-attachments
          path: ${{ env.NAME }}/attachments/

  # 清理旧的 GHCR 镜像版本（关键：只传包名，不带用户名前缀！）
  prune-old-images:
    runs-on: ubuntu-latest
    needs: challenge-build
    if: always()  # 无论构建成功与否都尝试清理
    permissions:
      packages: write

    steps:
      # 1. 获取小写的纯包名（仅项目名，不含 owner）
      - name: Get package name (lowercase)
        id: pkg
        run: |
          pkg_name=$(echo '${{ env.NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "pkg_name=$pkg_name" >> "$GITHUB_OUTPUT"
          echo "Using package name: $pkg_name"

      # 2. 调用清理 action（dry-run 模式用于预览）
      - name: Clean old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}     # 用户名，如 yuanziran-zhangzhihao
          package: ${{ steps.pkg.outputs.pkg_name }} # 仅包名，如 pwn-snake
          exclude-tags: latest                      # 保留 latest 标签
          dry-run: true                             # 先预览，确认无误后改为 false
          delete-untagged: true                     # 删除未标记的版本
          delete-ghost-images: true                 # 删除幽灵镜像