name: pwn-snake

on:
  push:
    branches: [pwn-snake]
    paths:
      - "pwn-snake/**"
      - ".github/workflows/pwn-snake.yml"
  workflow_dispatch:

env:
  NAME: pwn-snake
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 推送容器镜像到 GHCR 所需
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check Dockerfile
        run: |
          dockerfile_path="${{ env.NAME }}/build/Dockerfile"
          echo "Looking for Dockerfile at: $dockerfile_path"
          test -f "${{ env.NAME }}/build/src/pwn"
          test -f "${{ env.NAME }}/build/src/start.sh"
          test -f "${{ env.NAME }}/build/src/challenge-entry.sh"
          if [ ! -f "$dockerfile_path" ]; then
            echo "❌ Dockerfile not found!"
            exit 1
          fi
          echo "✅ Dockerfile found at: $(pwd)/$dockerfile_path"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.NAME }}/build
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:sha-${{ github.sha }}

      - name: Run post-build script
        working-directory: ${{ env.NAME }}/build
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          NAME: ${{ env.NAME }}
          IMAGE_TAG: ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:sha-${{ github.sha }}
        run: |
          sed -i 's/\r$//' post-build.sh
          chmod +x post-build.sh
          ./post-build.sh

      - name: Verify local debug binary matches attachment
        run: |
          cmp -s ${{ env.NAME }}/build/src/pwn ${{ env.NAME }}/attachments/pwn
          sha256sum ${{ env.NAME }}/build/src/pwn ${{ env.NAME }}/attachments/pwn

      - name: Start smoke container
        run: |
          docker run -d --name pwn-snake-smoke \
            -p 8000:8000 \
            -e 'FLAG=FLAG{ci_smoke_test}' \
            ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:sha-${{ github.sha }}

      - name: Wait for listener log
        run: |
          ready=0
          for _ in $(seq 1 30); do
            if docker logs pwn-snake-smoke 2>&1 | grep -q 'pwn-snake service listening on 8000'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run interaction smoke test
        run: |
          docker exec pwn-snake-smoke /bin/sh -lc \
            '{ printf "q\nsmoke-check\n"; sleep 5; } | socat - TCP:127.0.0.1:8000,connect-timeout=5' \
            | tee pwn-snake-smoke-transcript.log
          grep -q 'Game Over!' pwn-snake-smoke-transcript.log
          grep -q 'Final Score: 0' pwn-snake-smoke-transcript.log

      - name: Capture smoke diagnostics
        if: failure()
        run: |
          docker ps -a > docker-ps.log 2>&1 || true
          docker logs pwn-snake-smoke > pwn-snake-smoke.log 2>&1 || true
          docker top pwn-snake-smoke -eo pid,ppid,cmd > pwn-snake-smoke.top 2>&1 || true

      - name: Upload attachments
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-attachments
          path: ${{ env.NAME }}/attachments/

      - name: Export image tar for platform import
        run: |
          mkdir -p ${{ env.NAME }}/deploy
          cid="$(docker create "${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:sha-${{ github.sha }}")"
          trap 'docker rm -v "$cid" >/dev/null 2>&1 || true' EXIT
          docker export "$cid" -o ${{ env.NAME }}/deploy/rootfs.tar
          docker import \
            --change 'ENV TERM=xterm' \
            --change 'EXPOSE 8000' \
            --change 'WORKDIR /home/ctf' \
            --change 'CMD /start.sh' \
            ${{ env.NAME }}/deploy/rootfs.tar \
            "${{ env.NAME }}:platform-${{ github.sha }}"
          rm -f ${{ env.NAME }}/deploy/rootfs.tar
          docker save "${{ env.NAME }}:platform-${{ github.sha }}" | gzip -9 > ${{ env.NAME }}/deploy/${{ env.NAME }}-image.tar.gz
          ls -lh ${{ env.NAME }}/deploy

      - name: Upload platform image tar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-platform-image
          path: ${{ env.NAME }}/deploy/${{ env.NAME }}-image.tar.gz

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-smoke-logs
          path: |
            docker-ps.log
            pwn-snake-smoke.log
            pwn-snake-smoke.top
            pwn-snake-smoke-transcript.log

      - name: Cleanup smoke container
        if: always()
        run: |
          docker rm -f pwn-snake-smoke >/dev/null 2>&1 || true

  prune-old-images:
    runs-on: ubuntu-latest
    needs: challenge-build
    if: always()
    permissions:
      packages: write

    steps:
      - name: Get package name (lowercase)
        id: pkg
        run: |
          pkg_name=$(echo '${{ env.NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "pkg_name=$pkg_name" >> "$GITHUB_OUTPUT"
          echo "Using package name: $pkg_name"

      - name: Clean old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: ${{ steps.pkg.outputs.pkg_name }}
          exclude-tags: latest
          dry-run: true
          delete-untagged: true
          delete-ghost-images: true
