name: pwn-edit

on:
  push:
    branches: [pwn-edit]
    paths:
      - "pwn-edit/**"
      - ".github/workflows/pwn-edit.yml"
  workflow_dispatch:

env:
  NAME: pwn-edit

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true

      - name: Prepare image vars
        id: vars
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}"
          short_sha="${GITHUB_SHA::7}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Check Dockerfile
        run: |
          dockerfile_path="${{ env.NAME }}/build/Dockerfile"
          test -f "$dockerfile_path"
          test -f "${{ env.NAME }}/build/src/pwn"
          test -f "${{ env.NAME }}/build/src/start.sh"
          test -f "${{ env.NAME }}/build/src/challenge-entry.sh"
          test -f "${{ env.NAME }}/build/post-build.sh"
          test -f "${{ env.NAME }}/build/smoke.py"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.NAME }}/build
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.short_sha }}

      - name: Pull image for artifact generation
        run: docker pull ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.short_sha }}

      - name: Run post-build script
        working-directory: ${{ env.NAME }}/build
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          NAME: ${{ env.NAME }}
          IMAGE_TAG: ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.short_sha }}
        run: |
          chmod +x post-build.sh
          ./post-build.sh

      - name: Check generated attachments
        run: |
          test -f ${{ env.NAME }}/attachments/pwn
          test -f ${{ env.NAME }}/attachments/libc.so.6
          test -f ${{ env.NAME }}/attachments/ld-linux-x86-64.so.2
          test -f ${{ env.NAME }}/attachments/README.md
          test -f ${{ env.NAME }}/attachments/pwn-edit.tar.gz
          ls -lh ${{ env.NAME }}/attachments

      - name: Start smoke container
        run: |
          docker rm -f pwn-edit-smoke >/dev/null 2>&1 || true
          docker run -d --name pwn-edit-smoke -p 8000:8000 -e 'FLAG_VALUE=FLAG{ci_smoke_test}' \
            ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.short_sha }}

      - name: Wait for tcp service
        run: |
          ready=0
          for _ in $(seq 1 60); do
            if nc -z 127.0.0.1 8000; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run smoke exploit
        run: |
          python3 ${{ env.NAME }}/build/smoke.py --host 127.0.0.1 --port 8000 --expect 'FLAG{ci_smoke_test}' \
            | tee smoke.log

      - name: Capture smoke container log
        if: always()
        run: docker logs pwn-edit-smoke > smoke-container.log 2>&1 || true

      - name: Upload attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-attachments
          path: ${{ env.NAME }}/attachments/

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-smoke
          path: |
            smoke.log
            smoke-container.log

      - name: Cleanup smoke container
        if: always()
        run: docker rm -f pwn-edit-smoke >/dev/null 2>&1 || true

  prune-old-images:
    runs-on: ubuntu-latest
    needs: challenge-build
    if: always()
    permissions:
      packages: write

    steps:
      - name: Clean old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: pwn-edit
          exclude-tags: latest
          dry-run: true
          delete-untagged: true
          delete-ghost-images: true
