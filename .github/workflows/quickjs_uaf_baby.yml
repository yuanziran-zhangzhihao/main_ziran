name: quickjs_uaf_baby

on:
  push:
    branches: [pwn-js]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker/**"
      - "quickjs-2024-01-13/**"
      - "solve.js"
      - "README.md"
      - "build.sh"
      - ".github/workflows/quickjs_uaf_baby.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/quickjs-uaf-baby:latest

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dockerfile
        run: |
          test -f Dockerfile
          test -f docker/build.sh
          test -f quickjs-2024-01-13/Makefile

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - name: Pull image for artifact generation
        run: docker pull ${{ env.IMAGE }}

      - name: Generate challenge artifacts
        run: docker run --rm -v "$PWD:/work" ${{ env.IMAGE }}

      - name: Check generated files
        run: |
          test -f dist/qjs
          test -f dist/solve.js
          test -f dist/README.md
          test -f dist/quickjs-uaf-baby.tar.gz
          file dist/qjs
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickjs-uaf-baby-artifacts
          path: dist/

  prune-old-images:
    runs-on: ubuntu-latest
    needs: challenge-build
    if: always()
    permissions:
      packages: write

    steps:
      - name: Clean old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: quickjs-uaf-baby
          exclude-tags: latest
          dry-run: true
          delete-untagged: true
          delete-ghost-images: true
