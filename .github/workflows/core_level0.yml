name: core_level0

on:
  push:
    branches: [core_level0]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker/**"
      - "initramfs/**"
      - "babydriver.c"
      - "exp.c"
      - "Makefile"
      - "run.sh"
      - "README.md"
      - "PLATFORM_DEPLOY.md"
      - ".github/workflows/core_level0.yml"
  workflow_dispatch:

env:
  NAME: core_level0
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:sha-${{ github.sha }}

      - name: Extract attachments and smoke payload
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          NAME: ${{ env.NAME }}
          IMAGE_TAG: ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:sha-${{ github.sha }}
        run: |
          chmod +x docker/post-build.sh
          ./docker/post-build.sh

      - name: Start smoke container
        run: |
          docker run -d --name core_level0-smoke \
            -p 1337:1337 \
            -e 'FLAG=FLAG{ci_smoke_test}' \
            ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:sha-${{ github.sha }}

      - name: Wait for container listener log
        run: |
          ready=0
          for _ in $(seq 1 60); do
            if docker logs core_level0-smoke 2>&1 | grep -q 'core_level0 docker service listening on 1337'
            then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1

      - name: Run black-box exploit smoke test
        run: |
          python3 docker/smoke.py \
            --host 127.0.0.1 \
            --port 1337 \
            --payload smoke/exp.static \
            --boot-timeout 180 \
            --flag-timeout 180 \
            --expect 'FLAG{ci_smoke_test}'

      - name: Capture smoke diagnostics
        if: failure()
        run: |
          docker ps -a > docker-ps.log 2>&1 || true
          docker logs core_level0-smoke > core_level0-smoke.log 2>&1 || true
          docker top core_level0-smoke -eo pid,ppid,cmd > core_level0-smoke.top 2>&1 || true

      - name: Upload attachments
        uses: actions/upload-artifact@v4
        with:
          name: core_level0-attachments
          path: attachments/

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core_level0-smoke-logs
          path: |
            attachments/
            smoke/
            docker-ps.log
            core_level0-smoke.log
            core_level0-smoke.top

      - name: Cleanup smoke container
        if: always()
        run: |
          docker logs core_level0-smoke > core_level0-smoke.log 2>&1 || true
          docker rm -f core_level0-smoke >/dev/null 2>&1 || true

  prune-old-images:
    runs-on: ubuntu-latest
    needs: challenge-build
    if: always()
    permissions:
      packages: write

    steps:
      - name: Clean old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: core_level0
          exclude-tags: latest
          dry-run: true
          delete-untagged: true
          delete-ghost-images: true
