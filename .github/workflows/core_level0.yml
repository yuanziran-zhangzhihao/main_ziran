name: core_level0

on:
  push:
    branches: [core_level0]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker/**"
      - "initramfs/**"
      - "babydriver.c"
      - "exp.c"
      - "Makefile"
      - "run.sh"
      - "README.md"
      - ".github/workflows/core_level0.yml"
  workflow_dispatch:

env:
  NAME: core_level0
  IMAGE: ghcr.io/${{ github.repository_owner }}/core_level0:latest

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dockerfile
        run: |
          if [ ! -f Dockerfile ]; then
            echo "Dockerfile not found in repository root"
            exit 1
          fi
          echo "Using Dockerfile: $(pwd)/Dockerfile"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - name: Pull image for artifact generation
        run: docker pull ${{ env.IMAGE }}

      - name: Generate challenge artifacts
        run: docker run --rm -v "$PWD:/work" ${{ env.IMAGE }}

      - name: Check generated files
        run: |
          test -f bzImage
          test -f rootfs.cpio.gz
          test -f run.sh
          ls -lh bzImage rootfs.cpio.gz run.sh

      - name: Upload attachments
        uses: actions/upload-artifact@v4
        with:
          name: core_level0-artifacts
          path: |
            bzImage
            rootfs.cpio.gz
            run.sh
            babydriver.c
            exp.c
            README.md

  prune-old-images:
    runs-on: ubuntu-latest
    needs: challenge-build
    if: always()
    permissions:
      packages: write

    steps:
      - name: Clean old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: core_level0
          exclude-tags: latest
          dry-run: true
          delete-untagged: true
          delete-ghost-images: true
