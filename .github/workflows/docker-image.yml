name: docker-image

on:
  push:
    branches:
      - CVE2017iot
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dockerfile
        run: |
          test -f Dockerfile
          echo "Using Dockerfile: $(pwd)/Dockerfile"

      - name: Compute image name
        id: prep
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repo="$(printf '%s' "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')"
          branch="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${repo}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${branch}" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/CVE2017iot' }}
            type=raw,value=${{ steps.prep.outputs.branch_tag }},enable=${{ github.ref == 'refs/heads/CVE2017iot' }}
            type=ref,event=tag
            type=sha

      - name: Build and push package image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=ubuntu:20.04
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify package latest from GHCR
        if: github.ref == 'refs/heads/CVE2017iot'
        run: |
          docker pull "${{ steps.prep.outputs.image }}:latest"
          docker pull "${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.branch_tag }}"

      - name: Verify package release tag from GHCR
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker pull "${{ steps.prep.outputs.image }}:${{ github.ref_name }}"
