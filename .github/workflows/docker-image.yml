name: docker-image

on:
  push:
    branches:
      - CVE2017iot
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - 'README.md'
      - 'build_router_rootfs_image.sh'
      - 'boot_router.sh'
      - 'docker-entrypoint.sh'
      - 'exp.py'
      - 'init_router_console.sh'
      - 'start.sh'
      - 'ctf/**'
      - '_HG532eV100R001C01B020_upgrade_packet.bin.extracted/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

env:
  PACKAGE_NAME: cve2017iot-hg532
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dockerfile
        run: |
          test -f Dockerfile
          echo "Using Dockerfile: $(pwd)/Dockerfile"

      - name: Compute image name
        id: prep
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          branch="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]')"
          package="$(printf '%s' "$PACKAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${package}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${branch}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/CVE2017iot ]]; then
            echo "smoke_tag=${branch}" >> "$GITHUB_OUTPUT"
          else
            echo "smoke_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/CVE2017iot' }}
            type=raw,value=${{ steps.prep.outputs.branch_tag }},enable=${{ github.ref == 'refs/heads/CVE2017iot' }}
            type=ref,event=tag
            type=sha

      - name: Build and push package image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=ubuntu:20.04
            REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull image from GHCR
        run: docker pull "${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.smoke_tag }}"

      - name: Start challenge container
        run: |
          docker rm -f hg532-smoke >/dev/null 2>&1 || true
          docker run -d \
            --name hg532-smoke \
            -p 37215:37215 \
            -e FLAG_VALUE='FLAG{ci_smoke_test}' \
            -e CHECK_TIMEOUT=120 \
            -e BOOT_TIMEOUT=600 \
            "${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.smoke_tag }}"

      - name: Wait for challenge service
        run: |
          ready=0
          for _ in $(seq 1 300); do
            running="$(docker inspect -f '{{.State.Running}}' hg532-smoke 2>/dev/null || echo false)"
            if [[ "$running" != "true" ]]; then
              echo '[-] challenge container exited before service became ready'
              docker ps -a || true
              docker logs hg532-smoke || true
              exit 1
            fi

            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:37215/ctrlt/DeviceUpgrade_1 || true)"
            if [[ "$code" == "404" || "$code" == "200" ]]; then
              ready=1
              break
            fi

            if (( _ % 15 == 0 )); then
              echo "[*] waiting for 37215, current http_code=${code:-none}"
              docker exec hg532-smoke bash -lc 'ps -ef | grep -E "qemu|tmux|python3|upnp" | grep -v grep || true' || true
              docker exec hg532-smoke bash -lc 'tmux capture-pane -pS -60 -t hg532 2>/dev/null | tail -n 40 || true' || true
            fi
            sleep 2
          done

          if [[ "$ready" != "1" ]]; then
            echo '[-] challenge service did not become ready in time'
            docker logs hg532-smoke || true
            exit 1
          fi

      - name: Run PoC smoke test
        run: |
          docker exec hg532-smoke bash -lc "printf '\n' | python3 /opt/hg532-ctf/exp.py" | tee smoke.log
          grep -q 'FLAG{ci_smoke_test' smoke.log

      - name: Collect runtime logs
        if: always()
        run: |
          docker logs hg532-smoke > docker-smoke-container.log 2>&1 || true
          docker exec hg532-smoke bash -lc "tmux capture-pane -pS -200 -t hg532" > qemu-console.log 2>&1 || true
          docker rm -f hg532-smoke >/dev/null 2>&1 || true

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg532-smoke-logs
          path: |
            smoke.log
            docker-smoke-container.log
            qemu-console.log
