name: docker-image

on:
  push:
    branches:
      - CVE2017iot
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'PLATFORM_DEPLOY.md'
      - 'README.md'
      - 'build_router_rootfs_image.sh'
      - 'boot_router.sh'
      - 'docker-entrypoint.sh'
      - 'exp.py'
      - 'init_router_console.sh'
      - 'start.sh'
      - 'ctf/**'
      - '_HG532eV100R001C01B020_upgrade_packet.bin.extracted/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

env:
  PACKAGE_NAME: cve2017iot-hg532
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dockerfile
        run: |
          test -f Dockerfile
          echo "Using Dockerfile: $(pwd)/Dockerfile"

      - name: Compute image name
        id: prep
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          branch="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]')"
          package="$(printf '%s' "$PACKAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${package}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${branch}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/CVE2017iot' }}
            type=raw,value=${{ steps.prep.outputs.branch_tag }},enable=${{ github.ref == 'refs/heads/CVE2017iot' }}
            type=ref,event=tag
            type=sha

      - name: Build and push package image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=ubuntu:20.04
            REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull exact built image
        run: docker pull "${{ steps.prep.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Export deploy bundles
        run: |
          tar -czf cve2017iot-platform-direct.tar.gz \
            .dockerignore \
            .gitignore \
            .github/workflows/docker-image.yml \
            Dockerfile \
            PLATFORM_DEPLOY.md \
            README.md \
            build_router_rootfs_image.sh \
            boot_router.sh \
            docker-entrypoint.sh \
            exp.py \
            init_router_console.sh \
            start.sh \
            ctf \
            _HG532eV100R001C01B020_upgrade_packet.bin.extracted
          docker tag "${{ steps.prep.outputs.image }}@${{ steps.build.outputs.digest }}" "${{ steps.prep.outputs.image }}:artifact"
          docker save "${{ steps.prep.outputs.image }}:artifact" | gzip -1 > cve2017iot-hg532-image.tar.gz
          ls -lh cve2017iot-hg532-image.tar.gz cve2017iot-platform-direct.tar.gz

      - name: Deterministic image self-check
        run: |
          docker run --rm             --entrypoint /bin/bash             "${{ steps.prep.outputs.image }}@${{ steps.build.outputs.digest }}"             -lc '
              set -euo pipefail
              bash -n /opt/hg532-ctf/start.sh
              bash -n /opt/hg532-ctf/boot_router.sh
              bash -n /opt/hg532-ctf/init_router_console.sh
              python3 -m py_compile /opt/hg532-ctf/exp.py
              /opt/hg532-ctf/ctf/install_guest_assets.sh
              /opt/hg532-ctf/build_router_rootfs_image.sh
              test -f /opt/hg532-ctf/hg532-rootfs.ext2
              qemu-system-mips --version | head -n 1
              ls -lh /opt/hg532-ctf/hg532-rootfs.ext2
            ' | tee image-selfcheck.log

      - name: Upload self-check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg532-image-selfcheck
          path: image-selfcheck.log

      - name: Upload deploy bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg532-deploy-bundles
          path: |
            cve2017iot-hg532-image.tar.gz
            cve2017iot-platform-direct.tar.gz

      - name: Start smoke container
        run: |
          docker rm -f hg532-smoke >/dev/null 2>&1 || true
          docker run -d --name hg532-smoke -p 37215:37215 -e FLAG_VALUE='FLAG{ci_smoke_test}' "${{ steps.prep.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Wait for published endpoint
        run: |
          ready=0
          for _ in $(seq 1 180); do
            http_code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:37215/ctrlt/DeviceUpgrade_1 || true)"
            echo "[*] waiting for 37215, current http_code=${http_code}"
            if [ "$http_code" != "000" ]; then
              ready=1
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx hg532-smoke; then
              echo "[-] challenge container exited before service became ready"
              docker ps -a
              exit 1
            fi
            sleep 2
          done
          test "$ready" -eq 1

      - name: Run end-to-end exploit smoke test
        run: |
          docker exec hg532-smoke python3 /opt/hg532-ctf/exp.py --host 127.0.0.1 --port 37215 --yes --ready-timeout 60 --flag-timeout 20 | tee smoke-exp.log
          grep -q '^flag:' smoke-exp.log

      - name: Collect smoke logs
        if: always()
        run: |
          docker logs hg532-smoke > docker-smoke-container.log 2>&1 || true
          docker exec hg532-smoke sh -lc 'tail -n 200 /tmp/hg532-session/console.log' > docker-smoke-console.log 2>&1 || true

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg532-smoke-logs
          path: |
            smoke-exp.log
            docker-smoke-container.log
            docker-smoke-console.log

      - name: Cleanup smoke container
        if: always()
        run: docker rm -f hg532-smoke >/dev/null 2>&1 || true
