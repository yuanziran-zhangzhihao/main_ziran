name: docker-image

on:
  push:
    branches:
      - CVE2017iot
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - 'README.md'
      - 'build_router_rootfs_image.sh'
      - 'boot_router.sh'
      - 'docker-entrypoint.sh'
      - 'exp.py'
      - 'init_router_console.sh'
      - 'start.sh'
      - 'ctf/**'
      - '_HG532eV100R001C01B020_upgrade_packet.bin.extracted/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

env:
  PACKAGE_NAME: cve2017iot-hg532
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dockerfile
        run: |
          test -f Dockerfile
          echo "Using Dockerfile: $(pwd)/Dockerfile"

      - name: Compute image name
        id: prep
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          branch="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]')"
          package="$(printf '%s' "$PACKAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${package}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${branch}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/CVE2017iot' }}
            type=raw,value=${{ steps.prep.outputs.branch_tag }},enable=${{ github.ref == 'refs/heads/CVE2017iot' }}
            type=ref,event=tag
            type=sha

      - name: Build and push package image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=ubuntu:20.04
            REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull exact built image
        run: docker pull "${{ steps.prep.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Deterministic image self-check
        run: |
          docker run --rm             --entrypoint /bin/bash             "${{ steps.prep.outputs.image }}@${{ steps.build.outputs.digest }}"             -lc '
              set -euo pipefail
              bash -n /opt/hg532-ctf/start.sh
              bash -n /opt/hg532-ctf/boot_router.sh
              bash -n /opt/hg532-ctf/init_router_console.sh
              python3 -m py_compile /opt/hg532-ctf/exp.py
              /opt/hg532-ctf/ctf/install_guest_assets.sh
              /opt/hg532-ctf/build_router_rootfs_image.sh
              test -f /opt/hg532-ctf/hg532-rootfs.ext2
              qemu-system-mips --version | head -n 1
              ls -lh /opt/hg532-ctf/hg532-rootfs.ext2
            ' | tee image-selfcheck.log

      - name: Upload self-check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg532-image-selfcheck
          path: image-selfcheck.log
