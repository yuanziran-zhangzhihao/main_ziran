name: pwn-ret2dlresolve

on:
  push:
    branches: [pwn-ret2dlresolve]
    paths:
      - "pwn-ret2dlresolve/**"
      - ".github/workflows/pwn-ret2dlresolve.yml"
  workflow_dispatch:

env:
  NAME: pwn-ret2dlresolve
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/pwn-ret2dlresolve
  IMAGE_SHA_TAG: sha-${{ github.sha }}

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 推送容器镜像到 GHCR 所需
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check challenge files
        run: |
          test -f ${{ env.NAME }}/build/Dockerfile
          test -f ${{ env.NAME }}/build/Makefile
          test -f ${{ env.NAME }}/build/src/challenge.c
          test -f ${{ env.NAME }}/build/src/launcher.c
          test -f ${{ env.NAME }}/solve.py

      - name: Build runtime directory
        run: |
          make -C ${{ env.NAME }}/build runtime
          file ${{ env.NAME }}/build/runtime/home/ctf/pwn
          file ${{ env.NAME }}/build/runtime/app/launcher

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke-test dependencies
        run: python3 -m pip install --no-cache-dir pwntools

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.NAME }}/build
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_SHA_TAG }}

      - name: Pull image for smoke test
        run: docker pull ${{ env.IMAGE_REPO }}:${{ env.IMAGE_SHA_TAG }}

      - name: Smoke test published image
        run: |
          docker run -d --name pwn-ret2dlresolve-smoke \
            -p 18000:8000 \
            -e 'FLAG_VALUE=flag{smoke_ret2dlresolve}' \
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_SHA_TAG }}
          for i in $(seq 1 30); do
            if python3 -c "import socket; s = socket.socket(); s.settimeout(1); s.connect(('127.0.0.1', 18000)); s.close()"
            then
              break
            fi
            sleep 1
          done
          python3 ${{ env.NAME }}/solve.py \
            --host 127.0.0.1 \
            --port 18000 \
            --binary ${{ env.NAME }}/build/runtime/home/ctf/pwn \
            --expect 'flag{smoke_ret2dlresolve}'

      - name: Dump smoke logs on failure
        if: failure()
        run: docker logs pwn-ret2dlresolve-smoke || true

      - name: Remove smoke container
        if: always()
        run: docker rm -f pwn-ret2dlresolve-smoke || true

      - name: Run post-build script
        working-directory: ${{ env.NAME }}/build
        run: |
          chmod +x post-build.sh
          ./post-build.sh

      - name: Upload attachments
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-attachments
          path: ${{ env.NAME }}/attachments/

  prune-old-images:
    runs-on: ubuntu-latest
    needs: challenge-build
    if: always()  # 无论构建成功与否都尝试清理
    permissions:
      packages: write

    steps:
      - name: Get package name (lowercase)
        id: pkg
        run: |
          pkg_name=$(echo '${{ env.NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "pkg_name=$pkg_name" >> "$GITHUB_OUTPUT"
          echo "Using package name: $pkg_name"

      - name: Clean old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: ${{ steps.pkg.outputs.pkg_name }}
          exclude-tags: latest
          dry-run: true
          delete-untagged: true
          delete-ghost-images: true
