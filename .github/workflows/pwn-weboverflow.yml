name: pwn-weboverflow

on:
  push:
    branches:
      - pwn-weboverflow
  workflow_dispatch:

env:
  NAME: pwn-server_fmt
  IMAGE_LATEST: ghcr.io/${{ github.repository_owner }}/pwn-server_fmt:latest
  IMAGE_SHA: ghcr.io/${{ github.repository_owner }}/pwn-server_fmt:sha-${{ github.sha }}

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true

      - name: Check required files
        run: |
          test -f pwn-weboverflow/build/Dockerfile
          test -f pwn-weboverflow/build/post-build.sh
          test -f pwn-weboverflow/build/src/pwn
          test -f pwn-weboverflow/build/src/server
          test -f pwn-weboverflow/build/src/start.sh
          test -f pwn-weboverflow/selftest/smoke.py
          test -f README.md
          test -f pwn-weboverflow/PLATFORM_DEPLOY.md

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./pwn-weboverflow/build
          push: true
          tags: |
            ${{ env.IMAGE_LATEST }}
            ${{ env.IMAGE_SHA }}

      - name: Pull image for validation
        run: docker pull ${{ env.IMAGE_SHA }}

      - name: Smoke test published image
        run: |
          set -euo pipefail
          CONTAINER_NAME=pwn-weboverflow-smoke
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          docker run -d --name "$CONTAINER_NAME" -p 18000:8000 -e 'FLAG_VALUE=FLAG{smoke_test}' ${{ env.IMAGE_SHA }}
          trap 'docker logs "$CONTAINER_NAME" || true; docker rm -f "$CONTAINER_NAME" || true' EXIT
          python3 pwn-weboverflow/selftest/smoke.py --host 127.0.0.1 --port 18000 --timeout 20

      - name: Run post-build script
        working-directory: pwn-weboverflow/build
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          NAME: ${{ env.NAME }}
          IMAGE_TAG: ${{ env.IMAGE_SHA }}
        run: |
          chmod +x post-build.sh
          ./post-build.sh

      - name: Verify attachments
        run: |
          test -f pwn-weboverflow/attachments/pwn
          test -f pwn-weboverflow/attachments/server
          test -f pwn-weboverflow/attachments/libc.so.6
          test -f pwn-weboverflow/attachments/ld-linux-x86-64.so.2
          ls -lh pwn-weboverflow/attachments

      - name: Build platform direct bundle
        run: |
          tar czf pwn-weboverflow-platform-direct.tar.gz \
            README.md \
            pwn-weboverflow/PLATFORM_DEPLOY.md \
            pwn-weboverflow/build \
            pwn-weboverflow/selftest

      - name: Upload attachments
        uses: actions/upload-artifact@v4
        with:
          name: pwn-weboverflow-attachments
          path: pwn-weboverflow/attachments/

      - name: Upload platform bundle
        uses: actions/upload-artifact@v4
        with:
          name: pwn-weboverflow-platform-direct
          path: pwn-weboverflow-platform-direct.tar.gz

  prune-old-images:
    runs-on: ubuntu-latest
    needs: challenge-build
    if: always()
    permissions:
      packages: write

    steps:
      - name: Clean old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: pwn-server_fmt
          exclude-tags: latest
          dry-run: true
          delete-untagged: true
          delete-ghost-images: true
