name: pwn-weboverflow

on:
  push:
    branches:
      - pwn-weboverflow
  workflow_dispatch:

env:
  NAME: pwn-weboverflow
  IMAGE: ghcr.io/${{ github.repository_owner }}/pwn-weboverflow:latest

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true

      - name: Check required files
        run: |
          test -f pwn-weboverflow/build/Dockerfile
          test -f pwn-weboverflow/build/post-build.sh
          test -f pwn-weboverflow/build/src/pwn
          test -f pwn-weboverflow/build/src/server
          test -f pwn-weboverflow/build/src/start.sh

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./pwn-weboverflow/build
          push: true
          tags: ${{ env.IMAGE }}

      - name: Pull image for post-build
        run: docker pull ${{ env.IMAGE }}

      - name: Run post-build script
        working-directory: pwn-weboverflow/build
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          NAME: ${{ env.NAME }}
          IMAGE_TAG: ${{ env.IMAGE }}
        run: |
          chmod +x post-build.sh
          ./post-build.sh

      - name: Verify attachments
        run: |
          test -f pwn-weboverflow/attachments/pwn
          test -f pwn-weboverflow/attachments/server
          test -f pwn-weboverflow/attachments/libc.so.6
          test -f pwn-weboverflow/attachments/ld-linux-x86-64.so.2
          ls -lh pwn-weboverflow/attachments

      - name: Upload attachments
        uses: actions/upload-artifact@v4
        with:
          name: pwn-weboverflow-attachments
          path: pwn-weboverflow/attachments/

  prune-old-images:
    runs-on: ubuntu-latest
    needs: challenge-build
    if: always()
    permissions:
      packages: write

    steps:
      - name: Clean old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: pwn-weboverflow
          exclude-tags: latest
          dry-run: true
          delete-untagged: true
          delete-ghost-images: true
