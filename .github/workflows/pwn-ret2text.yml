name: pwn-ret2text

on:
  push:
    branches: [pwn-ret2text]
    paths:
      - "pwn-ret2text/**"
      - ".github/workflows/pwn-ret2text.yml"
  workflow_dispatch:

env:
  NAME: pwn-ret2text
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check Dockerfile
        run: |
          dockerfile_path="${{ env.NAME }}/build/Dockerfile"
          echo "Looking for Dockerfile at: $dockerfile_path"
          if [ ! -f "$dockerfile_path" ]; then
            echo "❌ Dockerfile not found!"
            exit 1
          fi
          echo "✅ Dockerfile found at: $(pwd)/$dockerfile_path"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.NAME }}/build
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:sha-${{ github.sha }}

      - name: Run post-build script
        working-directory: ${{ env.NAME }}/build
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          NAME: ${{ env.NAME }}
          IMAGE_TAG: ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:sha-${{ github.sha }}
        run: |
          chmod +x post-build.sh
          ./post-build.sh

      - name: Start smoke container
        run: |
          docker run -d --name pwn-ret2text-smoke \
            -p 8000:8000 \
            -e 'FLAG_VALUE=FLAG{ci_smoke_test}' \
            ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:sha-${{ github.sha }}

      - name: Wait for listener log
        run: |
          ready=0
          for _ in $(seq 1 30); do
            if docker logs pwn-ret2text-smoke 2>&1 | grep -q 'pwn-ret2text listening on'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run exploit smoke test
        run: |
          python3 ${{ env.NAME }}/build/smoke.py \
            --host 127.0.0.1 \
            --port 8000 \
            --expect 'FLAG{ci_smoke_test}' \
            --ready-timeout 60

      - name: Capture smoke diagnostics
        if: failure()
        run: |
          docker ps -a > docker-ps.log 2>&1 || true
          docker logs pwn-ret2text-smoke > pwn-ret2text-smoke.log 2>&1 || true
          docker top pwn-ret2text-smoke -eo pid,ppid,cmd > pwn-ret2text-smoke.top 2>&1 || true

      - name: Upload attachments
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-attachments
          path: ${{ env.NAME }}/attachments/

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-smoke-logs
          path: |
            docker-ps.log
            pwn-ret2text-smoke.log
            pwn-ret2text-smoke.top

      - name: Cleanup smoke container
        if: always()
        run: |
          docker rm -f pwn-ret2text-smoke >/dev/null 2>&1 || true

  prune-old-images:
    runs-on: ubuntu-latest
    needs: challenge-build
    if: always()
    permissions:
      packages: write

    steps:
      - name: Get package name (lowercase)
        id: pkg
        run: |
          pkg_name=$(echo '${{ env.NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "pkg_name=$pkg_name" >> "$GITHUB_OUTPUT"
          echo "Using package name: $pkg_name"

      - name: Clean old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: ${{ steps.pkg.outputs.pkg_name }}
          exclude-tags: latest
          dry-run: true
          delete-untagged: true
          delete-ghost-images: true
