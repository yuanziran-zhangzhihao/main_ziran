name: Build and Deploy Docker Image

on:
  push:
    branches: [ pwn-ret2text ]
    paths: [ '.github/workflows/pwn-ret2text.yml', 'Dockerfile', 'build.sh' ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # ✅ 关键权限：允许推送镜像

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # ✅ 正确引用Secret

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}:latest

  prune:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()
    permissions:
      contents: read
      packages: write  # ✅ 关键权限

    steps:
      - name: Prune old packages
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ github.repository }}  # ✅ 关键修正：使用完整仓库路径
          exclude-tags: latest
          dry-run: false
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
