name: pwn-ret2text

on:
  push:
    branches: [pwn-ret2text]
    paths:
      - "pwn-ret2text/**"
      - ".github/workflows/pwn-ret2text.yml"
  workflow_dispatch:

env:
  NAME: pwn-ret2text
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true

      - name: Verify Dockerfile
        run: |
          echo "🔍 检查 Dockerfile 路径：${{ env.NAME }}/build/Dockerfile"
          if [ ! -f "${{ env.NAME }}/build/Dockerfile" ]; then
            echo "❌ 错误：未找到 Dockerfile！预期路径：${{ env.NAME }}/build/Dockerfile"
            exit 1
          fi
          echo "✅ Dockerfile 验证通过"
          echo "📂 build 目录内容："
          ls -la ${{ env.NAME }}/build

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}
          tags: type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.NAME }}/build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify image
        run: |
          echo "📦 已构建镜像列表："
          docker images | grep "${{ env.NAME }}"
          echo -e "\n🔍 检查目标镜像元数据："
          docker inspect ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:latest

      - name: Run post-build script
        working-directory: ${{ env.NAME }}/build
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          NAME: ${{ env.NAME }}
          IMAGE_TAG: ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:latest
        run: |
          echo "📂 当前工作目录：$(pwd)"
          echo "📄 post-build.sh 内容："
          cat post-build.sh
          
          chmod +x post-build.sh
          ./post-build.sh

      - name: Upload attachments
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-attachments
          path: ${{ env.NAME }}/attachments/
          retention-days: 30

  prune-old-images:
    runs-on: ubuntu-latest
    needs: challenge-build
    if: always()
    permissions:
      packages: write

    steps:
      - name: Generate lowercase package name
        id: pkg-name
        run: |
          full_name="${{ github.repository_owner }}/${{ github.repository }}/${{ env.NAME }}"
          lowercase_name=$(echo "$full_name" | tr '[:upper:]' '[:lower:]')
          echo "pkg_name=$lowercase_name" >> $GITHUB_OUTPUT

      - name: Prune old images from ghcr.io
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ steps.pkg-name.outputs.pkg_name }}
          exclude-tags: latest
          dry-run: false
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
