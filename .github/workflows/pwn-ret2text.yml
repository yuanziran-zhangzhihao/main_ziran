name: pwn-ret2text

on:
  push:
    branches: [pwn-ret2text]
    paths:
      - "pwn-ret2text/**"
      - ".github/workflows/pwn-ret2text.yml"
  workflow_dispatch:

env:
  NAME: pwn-ret2text  # 项目名称（和目录名一样）
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}  # 镜像前缀（比如 ghcr.io/yuanziran-zhangzhihao）

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 推镜像需要写权限
      id-token: write

    steps:
      # 1. 拉代码
      - name: Checkout code
        uses: actions/checkout@v4
        with: { lfs: true, submodules: true }

      # 2. 检查Dockerfile
      - name: Check Dockerfile
        run: |
          echo "找Dockerfile：${{ env.NAME }}/build/Dockerfile"
          if [ ! -f "${{ env.NAME }}/build/Dockerfile" ]; then
            echo "❌ 没找到Dockerfile！"; exit 1
          fi
          echo "✅ Dockerfile在这：$(pwd)/${{ env.NAME }}/build/Dockerfile"

      # 3. 登录ghcr.io
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}  # 你的GitHub用户名
          password: ${{ secrets.GITHUB_TOKEN }}  # GitHub自动给的Token

      # 4. 构建并推送镜像
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.NAME }}/build  # 构建上下文（Dockerfile所在目录）
          push: true  # 推送到ghcr.io
          tags: ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:latest  # 镜像标签（比如 ghcr.io/yuanziran-zhangzhihao/pwn-ret2text:latest）

      # 5. 提取附件（用你之前的post-build.sh）
      - name: Run post-build script
        working-directory: ${{ env.NAME }}/build
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          NAME: ${{ env.NAME }}
          IMAGE_TAG: ${{ env.IMAGE_PREFIX }}/${{ env.NAME }}:latest
        run: |
          chmod +x post-build.sh && ./post-build.sh

      # 6. 上传附件到Artifacts
      - name: Upload attachments
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-attachments
          path: ${{ env.NAME }}/attachments/

  # 清理旧镜像（重点修复这里！）
  prune-old-images:
    runs-on: ubuntu-latest
    needs: challenge-build  # 等构建完再清理
    if: always()  # 不管构建成功失败都试试清理（但找不到会跳过）
    permissions: { packages: write }

    steps:
      # 1. 生成包名（用户名/项目名，小写）
      - name: Get package name
        id: pkg
        run: |
          # 包名格式：用户名/项目名（比如 yuanziran-zhangzhihao/pwn-ret2text）
          pkg_name="${{ github.repository_owner }}/${{ env.NAME }}"
          echo "pkg_name=$(echo $pkg_name | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "包名是：$pkg_name"  # 日志里能看到

      # 2. 清理旧镜像（关键：告诉工具去用户账户找包！）
      - name: Clean old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 认证用
          owner: ${{ github.repository_owner }}  # 用户名（比如 yuanziran-zhangzhihao）→ 去谁的账户找
          package: ${{ steps.pkg.outputs.pkg_name }}  # 包名（比如 yuanziran-zhangzhihao/pwn-ret2text）
          exclude-tags: latest  # 保留最新的latest标签
          dry-run: true  # 第一次用true预览（看看会删啥），确认没问题再改成false
          delete-untagged: true  # 删没标签的旧镜像
          delete-ghost-images: true  # 删“幽灵镜像”（没实际文件的）
          # 注意：别加repository参数！加了就去仓库级找了，会错！
