name: pwn-ret2text

on:
  push:
    branches: [pwn-ret2text]
    paths:
      - "pwn-ret2text/**"
      - ".github/workflows/pwn-ret2text.yml"
  workflow_dispatch:

env:
  NAME: pwn-ret2text

jobs:
  challenge-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true

      - name: Verify Dockerfile
        run: |
          echo "🔍 检查 Dockerfile 路径：${{ env.NAME }}/build/Dockerfile"
          ls -la ${{ env.NAME }}/build || echo "⚠️ build 目录不存在！"
          
          if [ ! -f "${{ env.NAME }}/build/Dockerfile" ]; then
            echo "❌ 错误：未找到 Dockerfile！预期路径：${{ env.NAME }}/build/Dockerfile"
            exit 1
          fi
          echo "✅ Dockerfile 验证通过"

      # ✅ 仅登录 ghcr.io（删除阿里云登录步骤）
      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ✅ 仅提取 ghcr.io 镜像元数据（删除阿里云地址）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.NAME }}  # 仅 ghcr.io
          tags: type=raw,value=latest

      # ✅ 构建并仅推送到 ghcr.io
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.NAME }}/build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run post-build script
        working-directory: ${{ env.NAME }}/build
        run: |
          chmod +x post-build.sh
          ./post-build.sh

      - name: Upload attachments
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-attachments
          path: ${{ env.NAME }}/attachments/

  prune-old-images:
    runs-on: ubuntu-latest
    needs: challenge-build
    if: always()
    permissions:
      contents: read
      packages: write

    steps:
      - name: Generate lowercase package name
        id: pkg-name
        run: |
          full_name="${{ github.repository_owner }}/${{ github.repository }}/${{ env.NAME }}"
          lowercase_name=$(echo "$full_name" | tr '[:upper:]' '[:lower:]')
          echo "pkg_name=$lowercase_name" >> $GITHUB_OUTPUT

      - name: Prune old images from ghcr.io
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ steps.pkg-name.outputs.pkg_name }}
          exclude-tags: latest
          dry-run: false
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
